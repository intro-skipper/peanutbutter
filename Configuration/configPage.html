<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Peanut Butter Plugin Installer</title>
</head>
<body>
    <div id="PeanutButterConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <h1>Peanut Butter Plugin Installer</h1>
                <p>Upload a Jellyfin plugin ZIP or DLL to install it or replace its currently installed version.</p>
                <p class="fieldDescription">Only administrators can use this page. A server restart is required after every successful install or update.</p>

                <form id="PeanutButterForm" enctype="multipart/form-data">
                    <div id="PluginDropZone" class="pluginDropZone" role="button" tabindex="0" aria-controls="PluginFile" aria-label="Choose a plugin ZIP or DLL">
                        <input id="PluginFile" name="file" type="file" accept=".zip,.dll,application/zip,application/octet-stream" required>
                        <div class="pluginDropZoneTitle">Drop a plugin ZIP or DLL here</div>
                        <div class="pluginDropZoneHint">or click to choose a file</div>
                        <div id="PluginFileName" class="pluginDropZoneFileName"></div>
                    </div>
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>Install plugin</span>
                    </button>
                </form>
                <div id="PeanutButterResult" class="peanutButterStatus" role="status" aria-live="polite" hidden></div>
            </div>
        </div>
        <style>
            .pluginDropZone {
                border: 2px dashed rgba(255, 255, 255, .35);
                border-radius: .4em;
                cursor: pointer;
                margin: 1.5em 0;
                padding: 2.5em 1em;
                text-align: center;
                transition: border-color .15s ease, background-color .15s ease;
            }

            .pluginDropZone:hover,
            .pluginDropZone:focus-visible,
            .pluginDropZone.pluginDropZoneActive {
                background-color: rgba(255, 255, 255, .08);
                border-color: var(--theme-primary-color);
                outline: none;
            }

            .pluginDropZone input {
                height: 1px;
                opacity: 0;
                position: absolute;
                width: 1px;
            }

            .pluginDropZoneTitle {
                font-size: 1.15em;
                font-weight: 500;
            }

            .pluginDropZoneHint,
            .pluginDropZoneFileName {
                margin-top: .5em;
                opacity: .75;
            }

            .peanutButterStatus {
                border: 1px solid rgba(255, 255, 255, .25);
                border-radius: .4em;
                margin-top: 1.5em;
                padding: 1em;
            }

            .peanutButterStatus[data-state="success"] {
                border-color: #6fcf97;
            }

            .peanutButterStatus[data-state="error"] {
                border-color: #eb5757;
            }
        </style>
        <script type="text/javascript">
            (function () {
                var page = document.querySelector('#PeanutButterConfigPage');
                var form = document.querySelector('#PeanutButterForm');
                var dropZone = document.querySelector('#PluginDropZone');
                var fileInput = document.querySelector('#PluginFile');
                var fileName = document.querySelector('#PluginFileName');
                var result = document.querySelector('#PeanutButterResult');

                function setResult(message, state) {
                    result.textContent = message || '';
                    result.dataset.state = state || '';
                    result.hidden = !message;
                }

                function getErrorMessage(error) {
                    if (error && typeof error.clone === 'function' && typeof error.text === 'function') {
                        return error.clone().text().then(function (text) {
                            if (text && text.trim()) {
                                return getErrorMessage({
                                    responseText: text,
                                    status: error.status,
                                    statusText: error.statusText
                                });
                            }

                            return getErrorMessage({
                                status: error.status,
                                statusText: error.statusText
                            });
                        }).catch(function () {
                            return getErrorMessage({
                                status: error.status,
                                statusText: error.statusText
                            });
                        });
                    }

                    var payload = error && (error.responseJSON || error.response || error.body);

                    if (typeof payload === 'string') {
                        try {
                            payload = JSON.parse(payload);
                        } catch (parseError) {
                            return payload.trim() || 'The server did not return an error message.';
                        }
                    }

                    if (payload && typeof payload === 'object') {
                        return payload.detail || payload.Detail || payload.message || payload.Message || payload.title || payload.Title || 'The server did not return an error message.';
                    }

                    var responseText = error && error.responseText;
                    if (typeof responseText === 'string' && responseText.trim()) {
                        try {
                            return getErrorMessage({ response: JSON.parse(responseText) });
                        } catch (parseError) {
                            return responseText.trim();
                        }
                    }

                    if (error && error.status) {
                        return 'HTTP ' + error.status + (error.statusText ? ' ' + error.statusText : '');
                    }

                    return (error && (error.statusText || error.message)) || 'The server did not return an error message.';
                }

                function encodeAuthorizationValue(value) {
                    value = value || '';
                    try {
                        value = decodeURIComponent(value);
                    } catch (error) {
                        // The value was not encoded.
                    }

                    return encodeURIComponent(value);
                }

                function getAuthorizationHeader() {
                    return 'MediaBrowser Client="' + encodeAuthorizationValue(ApiClient.appName())
                        + '", Device="' + encodeAuthorizationValue(ApiClient.deviceName())
                        + '", DeviceId="' + encodeAuthorizationValue(ApiClient.deviceId())
                        + '", Version="' + encodeAuthorizationValue(ApiClient.appVersion())
                        + '", Token="' + encodeAuthorizationValue(ApiClient.accessToken()) + '"';
                }

                function showFileName() {
                    fileName.textContent = fileInput.files.length ? fileInput.files[0].name : '';
                }

                page.addEventListener('pageshow', function () {
                    setResult('');
                    fileInput.value = '';
                    showFileName();
                });

                fileInput.addEventListener('change', showFileName);
                dropZone.addEventListener('click', function (event) {
                    if (event.target !== fileInput) {
                        fileInput.click();
                    }
                });
                dropZone.addEventListener('keydown', function (event) {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        fileInput.click();
                    }
                });
                ['dragenter', 'dragover'].forEach(function (eventName) {
                    dropZone.addEventListener(eventName, function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        dropZone.classList.add('pluginDropZoneActive');
                    });
                });
                ['dragleave', 'drop'].forEach(function (eventName) {
                    dropZone.addEventListener(eventName, function (event) {
                        event.preventDefault();
                        event.stopPropagation();
                        dropZone.classList.remove('pluginDropZoneActive');
                    });
                });
                dropZone.addEventListener('drop', function (event) {
                    if (event.dataTransfer.files.length) {
                        fileInput.files = event.dataTransfer.files;
                        showFileName();
                    }
                });

                form.addEventListener('submit', function (event) {
                    event.preventDefault();
                    if (!fileInput.files.length) {
                        setResult('Choose a ZIP or DLL file first.', 'error');
                        return false;
                    }

                    var data = new FormData();
                    data.append('file', fileInput.files[0]);
                    Dashboard.showLoadingMsg();
                    setResult('Installing plugin...', 'pending');

                    fetch(ApiClient.getUrl('Plugins/PeanutButter/Install'), {
                        method: 'POST',
                        headers: {
                            Accept: 'application/json',
                            Authorization: getAuthorizationHeader()
                        },
                        credentials: 'same-origin',
                        body: data
                    }).then(function (response) {
                        if (!response.ok) {
                            throw response;
                        }

                        return response.json();
                    }).then(function (response) {
                        var action = response.Action || response.action || 'Installed';
                        var name = response.Name || response.name || 'plugin';
                        var version = response.Version || response.version || 'unknown version';
                        setResult(action + ' ' + name + ' ' + version + '. Restart Jellyfin to load it.', 'success');
                        fileInput.value = '';
                        showFileName();
                    }).catch(function (error) {
                        Promise.resolve(getErrorMessage(error)).then(function (message) {
                            setResult('Install failed: ' + message, 'error');
                        });
                    }).finally(function () {
                        Dashboard.hideLoadingMsg();
                    });
                    return false;
                });
            }());
        </script>
    </div>
</body>
</html>
